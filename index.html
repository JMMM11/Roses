<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f9d86f">
  <meta name="description" content="Un jardín animado de rosas amarillas dibujado completamente con SVG, CSS y JavaScript.">
  <title>Jardín de Rosas Amarillas</title>

  <style>
    :root {
      --sky-middle: #ffeaa0;
      --brown: #69410f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: relative;
      background: var(--sky-middle);
      color: var(--brown);
      font-family: Georgia, "Times New Roman", serif;
    }

    .garden {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 28rem;
      isolation: isolate;
      overflow: hidden;
    }

    #garden-scene {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .garden-title {
      position: absolute;
      z-index: 10;
      top: clamp(1.4rem, 6vh, 3.6rem);
      left: 50%;
      width: min(92vw, 48rem);
      padding: 0 .8rem;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
    }

    .garden-title::after {
      content: "";
      display: block;
      width: clamp(4rem, 12vw, 7rem);
      height: 1px;
      margin: .85rem auto 0;
      background: linear-gradient(90deg, transparent, rgba(117, 72, 13, .55), transparent);
    }

    .garden-title h1 {
      color: #75480d;
      font-size: clamp(1.8rem, 4.3vw, 3.65rem);
      font-style: italic;
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: .025em;
      text-shadow: 0 2px 0 rgba(255, 255, 255, .42), 0 10px 28px rgba(131, 76, 0, .12);
    }

    .garden-title h1 span {
      white-space: nowrap;
    }

    .garden-title p {
      margin-top: .55rem;
      color: rgba(89, 84, 44, .78);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: clamp(.7rem, 1.25vw, .88rem);
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .garden-note {
      position: absolute;
      z-index: 10;
      right: 50%;
      bottom: max(.65rem, env(safe-area-inset-bottom));
      padding: .38rem .8rem;
      transform: translateX(50%);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 999px;
      background: rgba(30, 66, 27, .28);
      color: rgba(255, 255, 234, .78);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: clamp(.56rem, 1vw, .68rem);
      letter-spacing: .05em;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    .sun-halo {
      transform-box: fill-box;
      transform-origin: center;
      animation: sun-breathe 7s ease-in-out infinite;
    }

    .sun-rays {
      transform-box: fill-box;
      transform-origin: center;
      animation: turn-rays 42s linear infinite;
    }

    .cloud-drift {
      animation: cloud-drift var(--cloud-speed, 24s) ease-in-out infinite alternate;
    }

    .pollen {
      animation: pollen-float var(--float-time, 6s) ease-in-out var(--float-delay, 0s) infinite;
    }

    .grass-blade {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: grass-wave var(--wave-time, 3.5s) ease-in-out var(--wave-delay, 0s) infinite;
    }

    .flower-sway {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: flower-sway var(--sway-time, 4.4s) ease-in-out var(--sway-delay, 0s) infinite;
      will-change: transform;
    }

    .bloom-breathe {
      transform-box: fill-box;
      transform-origin: center;
      animation: bloom-breathe var(--bloom-time, 3.8s) ease-in-out var(--bloom-delay, 0s) infinite;
    }

    .rose-position.is-back {
      opacity: .9;
    }

    .stem-highlight {
      opacity: .42;
    }

    .bee-flight,
    .butterfly-flight {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }

    .bee-flight {
      animation: bee-route 12s ease-in-out infinite;
    }

    .butterfly-flight {
      animation: butterfly-route 16s ease-in-out -4s infinite;
    }

    .bee-wing,
    .butterfly-wing {
      transform-box: fill-box;
      transform-origin: center;
      animation: wing-flap .3s ease-in-out infinite alternate;
    }

    .butterfly-wing {
      animation-duration: .62s;
    }

    @keyframes sun-breathe {
      0%, 100% { opacity: .64; transform: scale(.96); }
      50% { opacity: .92; transform: scale(1.07); }
    }

    @keyframes turn-rays {
      to { transform: rotate(360deg); }
    }

    @keyframes cloud-drift {
      from { transform: translateX(-16px); }
      to { transform: translateX(24px); }
    }

    @keyframes pollen-float {
      0%, 100% { opacity: .15; transform: translate(0, 0); }
      45% { opacity: .8; transform: translate(9px, -18px); }
      70% { opacity: .48; transform: translate(16px, -10px); }
    }

    @keyframes grass-wave {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes flower-sway {
      0%, 100% { transform: rotate(-1.7deg); }
      45% { transform: rotate(2.4deg); }
      72% { transform: rotate(1deg); }
    }

    @keyframes bloom-breathe {
      0%, 100% { transform: rotate(-.8deg) scale(1); }
      50% { transform: rotate(1deg) scale(1.025); }
    }

    @keyframes bee-route {
      0%, 100% { transform: translate(0, 0) rotate(-4deg); }
      18% { transform: translate(78px, -34px) rotate(7deg); }
      42% { transform: translate(164px, 10px) rotate(-5deg); }
      67% { transform: translate(92px, 54px) rotate(7deg); }
      84% { transform: translate(28px, 25px) rotate(-3deg); }
    }

    @keyframes butterfly-route {
      0%, 100% { transform: translate(0, 0) rotate(4deg); }
      22% { transform: translate(-86px, 32px) rotate(-8deg); }
      48% { transform: translate(-156px, -16px) rotate(5deg); }
      72% { transform: translate(-92px, -54px) rotate(-7deg); }
    }

    @keyframes wing-flap {
      from { transform: scaleX(1); }
      to { transform: scaleX(.28); }
    }

    @media (max-width: 640px) {
      .garden-title {
        top: max(1.15rem, env(safe-area-inset-top));
      }

      .garden-title h1 {
        font-size: clamp(1.8rem, 9vw, 2.7rem);
      }

      .garden-title h1 span {
        display: block;
      }

      .garden-title p {
        max-width: 18rem;
        margin-inline: auto;
        font-size: clamp(.62rem, 2.6vw, .7rem);
        line-height: 1.45;
        letter-spacing: .1em;
      }

      .garden-note {
        bottom: max(.45rem, env(safe-area-inset-bottom));
      }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      .garden-title {
        top: .8rem;
      }

      .garden-title p,
      .garden-title::after {
        display: none;
      }

      .garden-note {
        right: .55rem;
        bottom: .55rem;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sun-halo,
      .sun-rays,
      .cloud-drift,
      .pollen,
      .grass-blade,
      .flower-sway,
      .bloom-breathe,
      .bee-flight,
      .butterfly-flight,
      .bee-wing,
      .butterfly-wing {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="garden" aria-labelledby="garden-heading">
    <header class="garden-title">
      <h1 id="garden-heading"><span>Jardín de</span> <span>Rosas Amarillas</span></h1>
      <p>Un pequeño rincón bañado por el sol</p>

      <rect x="0" y="0" width="1200" height="800" fill="none" stroke="#7a4c16" stroke-width="20" opacity=".035"/>

  <script>
    (() => {
      "use strict";

      const SVG_NS = "http://www.w3.org/2000/svg";
      let seed = 20250921;

      const random = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };

      const between = (min, max) => min + (max - min) * random();
      const choose = (items) => items[Math.floor(random() * items.length)];

      const svgElement = (name, attributes = {}) => {
        const node = document.createElementNS(SVG_NS, name);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
        return node;
      };

      const useSymbol = (id, attributes = {}) => {
        const node = svgElement("use", attributes);
        node.setAttribute("href", `#${id}`);
        return node;
      };

      const grassPalette = ["#285729", "#31662c", "#3f7731", "#588c36", "#76a644"];

      function addGrass(targetId, count, yMin, yMax, heightMin, heightMax, opacityMin = .7) {
        const target = document.getElementById(targetId);

        for (let index = 0; index < count; index += 1) {
          const x = between(-10, 1210);
          const y = between(yMin, yMax);
          const height = between(heightMin, heightMax);
          const lean = between(-9, 9);
          const blade = svgElement("path", {
            d: `M ${x.toFixed(1)} ${y.toFixed(1)} Q ${(x + lean * .45).toFixed(1)} ${(y - height * .58).toFixed(1)} ${(x + lean).toFixed(1)} ${(y - height).toFixed(1)}`,
            fill: "none",
            stroke: choose(grassPalette),
            "stroke-width": between(2.3, 5.8).toFixed(1),
            "stroke-linecap": "round",
            opacity: between(opacityMin, 1).toFixed(2),
            class: "grass-blade"
          });

          blade.style.setProperty("--wave-time", `${between(2.7, 5.1).toFixed(2)}s`);
          blade.style.setProperty("--wave-delay", `${between(-5, 0).toFixed(2)}s`);
          target.appendChild(blade);
        }
      }

      function addLeaf(parent, height, side, scale, rotation) {
        const anchorX = side * between(-1.5, 3.5);
        const anchorY = -height * between(.36, .7);
        const leafGroup = svgElement("g", {
          transform: `translate(${anchorX.toFixed(1)} ${anchorY.toFixed(1)}) rotate(${rotation}) scale(${(side * scale).toFixed(2)} ${scale.toFixed(2)})`
        });
        leafGroup.appendChild(useSymbol("leaf"));
        parent.appendChild(leafGroup);
      }

      function createRose({ x, y, scale, index, depth, bud = false }) {
        const position = svgElement("g", {
          class: `rose-position ${depth === "back" ? "is-back" : ""}`,
          transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`,
          "aria-label": bud ? `Rosa amarilla en capullo ${index + 1}` : `Rosa amarilla abierta ${index + 1}`
        });

        const shadow = svgElement("ellipse", {
          cx: "0",
          cy: "2",
          rx: bud ? "17" : "24",
          ry: "5",
          fill: "#173a20",
          opacity: ".28",
          filter: "url(#groundBlur)"
        });
        position.appendChild(shadow);

        const flower = svgElement("g", { class: "flower-sway" });
        flower.style.setProperty("--sway-time", `${between(3.5, 6.2).toFixed(2)}s`);
        flower.style.setProperty("--sway-delay", `${between(-6, 0).toFixed(2)}s`);

        const height = between(depth === "back" ? 122 : 155, depth === "front" ? 224 : 205);
        const bend = between(-13, 13);
        const controlA = between(-12, 8);
        const controlB = between(-7, 12);
        const stemPath = `M 0 2 C ${controlA.toFixed(1)} ${(-height * .32).toFixed(1)}, ${controlB.toFixed(1)} ${(-height * .72).toFixed(1)}, ${bend.toFixed(1)} ${(-height).toFixed(1)}`;

        flower.appendChild(svgElement("path", {
          d: stemPath,
          fill: "none",
          stroke: "url(#stemGradient)",
          "stroke-width": "7",
          "stroke-linecap": "round"
        }));

        flower.appendChild(svgElement("path", {
          d: stemPath,
          fill: "none",
          stroke: "#9bc66d",
          "stroke-width": "1.3",
          "stroke-linecap": "round",
          class: "stem-highlight"
        }));

        addLeaf(flower, height, -1, between(.72, .96), between(-28, -10));
        addLeaf(flower, height, 1, between(.64, .9), between(-5, 17));

        if (!bud || random() > .35) {
          addLeaf(flower, height, random() > .5 ? -1 : 1, between(.48, .68), between(-18, 12));
        }

        const thornSide = random() > .5 ? 1 : -1;
        flower.appendChild(svgElement("path", {
          d: `M ${thornSide * 1.5} ${(-height * .27).toFixed(1)} l ${thornSide * 8} -9 l ${thornSide * -5} 12`,
          fill: "#245927",
          opacity: ".75"
        }));

        const headAngle = between(-7, 7);
        const headScale = bud ? between(.88, 1.05) : between(.9, 1.09);
        const headAnchor = svgElement("g", {
          transform: `translate(${bend.toFixed(1)} ${(-height).toFixed(1)}) rotate(${headAngle.toFixed(1)}) scale(${headScale.toFixed(2)} ${bud ? headScale.toFixed(2) : between(.88, 1.02).toFixed(2)})`
        });
        const bloom = svgElement("g", { class: "bloom-breathe" });
        bloom.style.setProperty("--bloom-time", `${between(3.1, 5.4).toFixed(2)}s`);
        bloom.style.setProperty("--bloom-delay", `${between(-5, 0).toFixed(2)}s`);
        bloom.appendChild(useSymbol(bud ? "roseBud" : "openRose"));
        headAnchor.appendChild(bloom);
        flower.appendChild(headAnchor);
        position.appendChild(flower);

        return position;
      }

      function plantRow({ targetId, count, y, scaleMin, scaleMax, depth, buds }) {
        const target = document.getElementById(targetId);
        const spacing = 1200 / count;

        for (let index = 0; index < count; index += 1) {
          const x = spacing * (index + .5) + between(-spacing * .27, spacing * .27);
          const rose = createRose({
            x,
            y: y + between(-12, 12),
            scale: between(scaleMin, scaleMax),
            index,
            depth,
            bud: buds.includes(index)
          });
          target.appendChild(rose);
        }
      }

      function addPollen() {
        const target = document.getElementById("pollen-layer");
        for (let index = 0; index < 22; index += 1) {
          const mote = svgElement("circle", {
            cx: between(40, 1160).toFixed(1),
            cy: between(190, 510).toFixed(1),
            r: between(1.1, 2.8).toFixed(1),
            fill: choose(["#fff9cf", "#ffe989", "#fffef1"]),
            class: "pollen"
          });
          mote.style.setProperty("--float-time", `${between(4.5, 8.5).toFixed(2)}s`);
          mote.style.setProperty("--float-delay", `${between(-8, 0).toFixed(2)}s`);
          target.appendChild(mote);
        }
      }

      addPollen();
      addGrass("grass-back", 155, 481, 548, 12, 31, .55);
      addGrass("grass-middle", 125, 540, 690, 18, 44, .58);

      plantRow({ targetId: "roses-back", count: 7, y: 552, scaleMin: .58, scaleMax: .72, depth: "back", buds: [1] });
      plantRow({ targetId: "roses-middle", count: 7, y: 666, scaleMin: .78, scaleMax: .98, depth: "middle", buds: [5] });
      plantRow({ targetId: "roses-front", count: 7, y: 795, scaleMin: 1.02, scaleMax: 1.24, depth: "front", buds: [2] });

      addGrass("grass-front", 125, 734, 815, 28, 72, .72);
    })();
  </script>
</body>
</html>
